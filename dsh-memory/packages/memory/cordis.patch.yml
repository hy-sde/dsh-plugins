# @hy-sde-org/dsh-memory — install surface for durable project memory.
#
# The `ctx.memory` SERVICE is host-plane: the store is durable project data
# that crosses sessions, so this bundle inserts one row into the profile's
# base composition. The model-facing retain/recall/reflect/memory_edit/learn
# tools live in @hy-sde-org/dsh-tool-memory and mount at the AGENT plane from
# a user agent preset (they resolve this host instance) — see
# examples/agent-preset/ in the package for the ready-to-copy preset.
#
# `insert` is the stock harness patch form for rows that don't exist in the
# deployment's composition (a plain `id:`+`name:` entry is a modification of
# an existing row). This patch INSERTS a new row only — it touches no existing
# row, so `dsh plugin add @hy-sde-org/dsh-memory` never breaks boot on a
# stock DeepSeek Harness (0.1.1-rc.2 and later). Without the preset row you
# get the service but no tools; without this row the preset tools fail loudly
# ("memory: no memory backend is registered") the first time they run.

- insert:
    - id: memory
      name: '@hy-sde-org/dsh-memory'
