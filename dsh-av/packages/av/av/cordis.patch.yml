# @hy-sde-org/dsh-av — install surface for the read-only Automic Vault
# service.
#
# The `ctx.av` SERVICE is host-plane: it is a stateless, read-only wrapper
# around the `av` CLI (scan / doctor / detectors / hardeners / list over the
# subprocess seam) with no durable state and no value-releasing verbs, so one
# instance across sessions is correct — this bundle inserts one row into the
# profile's base composition. The model-facing av_scan / av_doctor /
# av_catalog / av_list tools live in @hy-sde-org/dsh-tool-av and mount at the
# AGENT plane from a user agent preset (they resolve this host instance) —
# see examples/agent-preset/ in the package for the ready-to-copy preset.
#
# `insert` is the stock harness patch form for rows that don't exist in the
# deployment's composition (a plain `id:`+`name:` entry is a modification of
# an existing row). This patch INSERTS a new row only — it touches no existing
# row, so `dsh plugin add @hy-sde-org/dsh-av` never breaks boot on a stock
# DeepSeek Harness (0.1.1-rc.2 and later). Without the preset row you get the
# service but no tools; without this row the preset tools fail loudly
# ("av: no av service") the first time they run.

- insert:
    - id: av
      name: '@hy-sde-org/dsh-av'
