[package]
name = "dsh-omp-native"
version = "0.1.2-rc.1"
edition = "2024"
description = "Standalone native sidecar extracted from the oh-my-pi (omp) Rust rewrite: bounded PDF rasterization and read-only SQLite querying, called from the DeepSeek Harness over a pinned JSON CLI contract."
license = "MIT"
repository = "https://github.com/hy-sde/dsh-omp-native"

[[bin]]
name = "dsh-omp-native"
path = "src/main.rs"

[dependencies]
bytes = "1"
hayro = "0.7.1"
parking_lot = "0.12"
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint", "modern_sqlite", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
