ignoreWorkspaceCycles: true
overrides:
  # Upstream harness dists (incl. 0.2.1-rc.3) resolve zod 4.4.3; fresh
  # resolutions of the published peers otherwise float to 4.5.4 and split the type
  # identity mid-compilation (TS2375/TS2589 in dsh-graph/graph-projection).
  # published alpha.4 peers otherwise float to 4.5.4 and split the type
  # identity mid-compilation (TS2375/TS2589 in dsh-graph/graph-projection).
  zod: 4.4.3

