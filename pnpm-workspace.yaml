packages:
  - "dsh-*/packages/*"
  - "dsh-av/packages/*/*"
  - "dsh-browser/packages/*/*"
  - "dsh-logseq/packages/*/*"
  - "dsh-git/packages/git/tool-git"
  - "dsh-web-search-public"

# pnpm 11 blocks dependency postinstall scripts by default; native/CLI deps
# used by the plugins need theirs allowed. pnpm 11 key: allowBuilds (map of
# package -> boolean); older pnpm used onlyBuiltDependencies (list).
allowBuilds:
  "@ast-grep/cli": true
  "@deepseek-ai/dsh-subprocess-local": true
  esbuild: true
  koffi: true
  msgpackr-extract: true
  node-pty: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  # transitive of @earendil-works/pi-ai@1.0.0 (Route A pi-durable stack)
  "@google/genai": true

minimumReleaseAgeExclude:
  # pi-durable stack published 2026-10-01 (Route A engine + tools depend on it)
  - '@earendil-works/*'
  - '@deepseek-ai/dsh-agent-loop-testkit@0.2.1-alpha.2 || 0.2.1-alpha.4 || 0.2.1-rc.3'
