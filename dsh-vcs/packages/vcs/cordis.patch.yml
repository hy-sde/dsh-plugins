# @hy-sde-org/dsh-vcs — install surface for native vcs plumbing.
#
# The `ctx.vcs` SERVICE is host-plane: a stateless `pi-vcs` CLI wrapper
# (probe / repo-info / rev-diff / staged-diff / worktree-diff / status /
# watch over the subprocess seam) with no durable state, so one instance
# across sessions is correct — this bundle inserts one row into the profile's
# base composition. It is purely additive and feature-detected: the git
# service (`ctx.git`, TS/git-CLI) stays the default path, and `ctx.vcs`
# resolves only when a user-installed `pi-vcs` binary is reachable (config →
# `DSH_VCS_PATH` → PATH) and probing clean. No model-facing tools ship here —
# this package registers no tool rows, so no agent preset is needed.
#
# `insert` is the stock harness patch form for rows that don't exist in the
# deployment's composition (a plain `id:`+`name:` entry is a modification of
# an existing row). This patch INSERTS a new row only — it touches no existing
# row, so `dsh plugin add @hy-sde-org/dsh-vcs` never breaks boot on a stock
# DeepSeek Harness (0.1.1-rc.2 and later). Without this row the service simply
# does not exist; callers that need it fail loudly on first use
# ("vcs: no vcs service").

- insert:
    - id: vcs
      name: '@hy-sde-org/dsh-vcs'
