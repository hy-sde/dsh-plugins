# User agent preset for @hy-sde-org/dsh-git on OFFICIAL DeepSeek Harness
# releases (dsh-v0.1.2-rc.1 and later).
#
# Install: copy this directory to ~/.dsh/.agent-presets/<id>/ (pick any id),
# then select the preset in the Web UI preset picker (or `dsh agent` CLI).
#
# The `git` SERVICE row is added host-wide by the plugin's own
# cordis.patch.yml when you run `dsh plugin add`; this preset contributes
# ONLY the model-facing tool row. `@hy-sde-org/dsh-tool-git` registers no
# service of its own — it resolves the host instance across the plane
# boundary, so no realm/isolate is needed here.
#
# Copy any other rows from the preset you normally use (persona, bash, todo,
# ask-user, skills, ...) next to these; only the git row is special. If
# the package isn't installed, the loader reports the missing plugin on boot.

- id: tool-git
  name: '@hy-sde-org/dsh-tool-git'
  config:
    reviewProvider: spawn
    maxReviewers: 4
