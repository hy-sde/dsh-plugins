# @hy-sde-org/dsh-git — install surface for agentic git plumbing.
#
# The `ctx.git` SERVICE is host-plane: it is a stateless git CLI wrapper
# (diff capture/parsing, hunk staging, commit/push/log over the subprocess
# seam) with no durable state, so one instance across sessions is correct —
# this bundle inserts one row into the profile's base composition. The
# model-facing commit/commit_apply/review tools live in
# @hy-sde-org/dsh-tool-git and mount at the AGENT plane from a user agent
# preset (they resolve this host instance) — see examples/agent-preset/ in
# the package for the ready-to-copy preset.
#
# `insert` is the stock harness patch form for rows that don't exist in the
# deployment's composition (a plain `id:`+`name:` entry is a modification of
# an existing row). This patch INSERTS a new row only — it touches no existing
# row, so `dsh plugin add @hy-sde-org/dsh-git` never breaks boot on a stock
# DeepSeek Harness (0.1.1-rc.2 and later). Without the preset row you get the
# service but no tools; without this row the preset tools fail loudly
# ("git: no git service") the first time they run.

- insert:
    - id: git
      name: '@hy-sde-org/dsh-git'
