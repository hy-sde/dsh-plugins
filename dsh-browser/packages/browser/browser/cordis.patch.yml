# @hy-sde-org/dsh-browser — install surface for the agentic browser service.
#
# The `ctx.browser` SERVICE is host-plane: it owns real browser connections
# (launch / CDP-attach / relay) that must be shared across sessions within one
# process, so a single instance across sessions is correct — this bundle
# inserts one row into the profile's base composition. The model-facing
# `browser` tool lives in @hy-sde-org/dsh-tool-browser and mounts at the AGENT
# plane from a user agent preset (it resolves this host instance) — see
# examples/agent-preset/ in the package for the ready-to-copy preset.
#
# `insert` is the stock harness patch form for rows that don't exist in the
# deployment's composition (a plain `id:`+`name:` entry is a modification of
# an existing row). This patch INSERTS a new row only — it touches no existing
# row, so `dsh plugin add @hy-sde-org/dsh-browser` never breaks boot on a stock
# DeepSeek Harness (0.1.1-rc.2 and later). Without the preset row you get the
# service but no tools; without this row the preset tools fail loudly
# ("browser: no browser service") the first time they run.

- insert:
    - id: browser
      name: '@hy-sde-org/dsh-browser'
